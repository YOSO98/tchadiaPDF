name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Regles de style + tests Playwright
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Installer les dependances de developpement
        run: npm ci

      - name: Verifier les regles de style (tirets, palette de couleurs)
        run: node scripts/check-style-rules.js

      - name: Installer Chromium pour Playwright
        run: npx playwright install --with-deps chromium

      - name: Lancer la suite de tests Playwright
        run: npx playwright test

      - name: Publier le rapport Playwright en cas d'echec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
