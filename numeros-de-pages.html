<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ajouter des numéros de page à un PDF gratuit en ligne : tchadiaPdf</title>
  <meta name="description" content="Ajoutez une numérotation personnalisable (position, taille, format) sur toutes les pages de votre PDF, gratuitement et sans envoi sur un serveur.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Bloc d'options en colonne pour cet outil */
    #numOptions {
      flex-direction: column;
      align-items: stretch;
    }
    .opt-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .opt-group + .opt-group {
      margin-top: 4px;
    }

    /* Grille de positions 3 colonnes x 2 lignes */
    .pos-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      max-width: 420px;
    }
    .pos-grid button {
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 500;
      padding: 10px 8px;
      border: 1px solid var(--border);
      border-radius: var(--radius-btn);
      background: var(--white);
      color: var(--ink);
      cursor: pointer;
      transition: background 150ms ease, color 150ms ease, border-color 150ms ease;
      text-align: center;
    }
    .pos-grid button:hover:not(.active) { background: var(--blue-50); }
    .pos-grid button.active {
      background: var(--blue);
      color: var(--white);
      border-color: var(--blue);
    }

    @media (max-width: 480px) {
      .pos-grid { max-width: 100%; }
      .pos-grid button { font-size: 0.78rem; padding: 10px 4px; }
    }
  </style>
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="index.html" class="logo">tchadia<span>Pdf</span></a>
    <nav class="nav-tools"><a href="index.html#outils">Tous les outils</a></nav>
  </div>
</header>

<main class="tool-page">
  <h1>Numéros de page</h1>
  <p class="tool-sub">Ajoutez une numérotation personnalisée sur toutes les pages de votre PDF.</p>

  <div class="dropzone" id="dropzone" role="button" tabindex="0" aria-label="Choisir un fichier PDF">
    <svg class="dz-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
    <strong>Choisir un fichier PDF</strong>
    <span>ou glissez-le ici</span>
    <input type="file" id="fileInput" accept="application/pdf">
  </div>

  <div class="file-item" id="fileInfo" style="display:none">
    <span class="f-name" id="fileName"></span>
    <span class="f-meta" id="fileMeta"></span>
  </div>

  <div class="options" id="numOptions" style="display:none">
    <div class="opt-group">
      <label>Position :</label>
      <div class="pos-grid" id="posGrid">
        <button type="button" data-pos="haut-gauche">Haut gauche</button>
        <button type="button" data-pos="haut-centre">Haut centre</button>
        <button type="button" data-pos="haut-droite">Haut droite</button>
        <button type="button" data-pos="bas-gauche">Bas gauche</button>
        <button type="button" data-pos="bas-centre">Bas centre</button>
        <button type="button" data-pos="bas-droite" class="active">Bas droite</button>
      </div>
    </div>

    <div class="opt-group">
      <label>Taille :</label>
      <div class="seg" id="sizeSeg">
        <button type="button" data-size="9">Petite</button>
        <button type="button" data-size="12" class="active">Moyenne</button>
        <button type="button" data-size="16">Grande</button>
      </div>
    </div>

    <div class="opt-group">
      <label>Format :</label>
      <div class="seg" id="formatSeg">
        <button type="button" data-format="n" class="active">1</button>
        <button type="button" data-format="n-total">1 / n</button>
        <button type="button" data-format="page-n">Page 1</button>
      </div>
    </div>
  </div>

  <div class="msg" id="msg"></div>

  <button class="btn-primary" id="numBtn" disabled>Ajouter les numéros</button>

  <div class="progress-wrap" id="progress">
    <div class="progress-label">Traitement…</div>
    <div class="progress-bar"><div></div></div>
  </div>

  <div class="result" id="result">
    <p>Votre PDF numéroté est prêt.</p>
    <a class="btn-primary" href="#">Télécharger le PDF</a>
  </div>

  <div class="ad-slot" aria-hidden="true">Espace publicitaire</div>
</main>

<footer class="site-footer">
  <nav>
    <a href="a-propos.html">À propos</a>
    <a href="confidentialite.html">Confidentialité</a>
  </nav>
  © 2026 tchadiaPdf
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="js/common.js"></script>
<script src="js/numeros-de-pages.js"></script>
</body>
</html>
