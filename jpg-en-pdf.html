<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JPG en PDF gratuit en ligne, convertir des images en PDF : tchadiaPdf</title>
  <meta name="description" content="Convertissez vos images JPG et PNG en un document PDF, gratuitement. Choisissez l'orientation et les marges. Traitement 100% local.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="index.html" class="logo">tchadia<span>Pdf</span></a>
    <nav class="nav-tools"><a href="index.html#outils">Tous les outils</a></nav>
  </div>
</header>

<main class="tool-page">
  <h1>JPG en PDF</h1>
  <p class="tool-sub">Convertissez vos images JPG ou PNG en un seul document PDF.</p>

  <div class="dropzone" id="dropzone" role="button" tabindex="0" aria-label="Ajouter des images">
    <svg class="dz-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
    <strong>Choisir des images</strong>
    <span>JPG ou PNG, ou glissez-les ici</span>
    <input type="file" id="fileInput" accept="image/jpeg,image/png" multiple>
  </div>

  <div class="file-list" id="fileList"></div>

  <div class="options" id="imgOptions" style="display:none">
    <div>
      <label>Orientation :</label><br>
      <div class="seg" id="orientSeg" style="margin-top:6px">
        <button data-o="auto" class="active">Auto</button>
        <button data-o="portrait">Portrait</button>
        <button data-o="paysage">Paysage</button>
      </div>
    </div>
    <div>
      <label>Marges :</label><br>
      <div class="seg" id="marginSeg" style="margin-top:6px">
        <button data-m="0" class="active">Aucune</button>
        <button data-m="20">Petites</button>
        <button data-m="50">Grandes</button>
      </div>
    </div>
  </div>

  <div class="msg" id="msg"></div>

  <button class="btn-primary" id="convertBtn" disabled>Convertir en PDF</button>

  <div class="progress-wrap" id="progress">
    <div class="progress-label">Conversion…</div>
    <div class="progress-bar"><div></div></div>
  </div>

  <div class="result" id="result">
    <p>Votre PDF est prêt.</p>
    <a class="btn-primary" href="#">Télécharger le PDF</a>
  </div>

  <div class="ad-slot" aria-hidden="true">Espace publicitaire</div>
</main>

<footer class="site-footer">
  <nav>
    <a href="a-propos.html">À propos</a>
    <a href="confidentialite.html">Confidentialité</a>
    <a href="mentions-legales.html">Mentions légales</a>
  </nav>
  <button type="button" class="consent-banner-reopen-link">Gérer les publicités</button>
  © 2026 tchadiaPdf
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="js/common.js"></script>
<script src="js/jpg-en-pdf.js"></script>
<script src="js/analytics.js" defer></script>
<script src="js/ads.js" defer></script>
<script src="js/consent-banner.js" defer></script>
</body>
</html>
